<!DOCTYPE html>
<html>

<head>

    <style>
        body{
            background-color: grey;
            display: flex;
            align-items: center;
            flex-direction: column;
            height: 100vw;
        }

        div{
            background-color: darkgrey;
            width: 600px;
            height: 50px;
            margin: 10px 0 0 0;
            display: flex;
            align-items: center;
            padding: 5px;
            border-radius: 10px;
            border-style: solid;
            justify-content: center;
        }

        input{
            margin: 0 25px 0 25px;
            border-radius: 10px;
            border-style: solid;
            scale: 1.2;
        }
        
        button, select{
            border-radius: 10px;
            border-style: solid;
        }

        p{
            font-size: 32px;
        }

    </style>

</head>


<body>
    <div>
        <h1>Super Fancy Calculator</h1>
    </div>

    <div>
        <input id="gen1" type="number" placeholder="0">
        <select id="op">
            <option value="+">Add</option>
            <option value="-">Sub</option>
            <option value="*">Mul</option>
            <option value="/">Div</option>
        </select>
        <input id="gen2" type="number" placeholder="0">
        <button id="solve">Solve</button>
    </div>

    <div>
        <p id="answer">Answer =</p>
    </div>
</body>

<script src="Calc.js"></script>

</html>
